context:
  version: "0.24.0"
  mojo_version: "=1.1.0"

package:
  name: "extramojo"
  version: ${{ version }}

source:
  path: .
  use_gitignore: true

build:
  number: 0
  script:
    - mkdir -p "${PREFIX}/lib/mojo"
    - mojo precompile extramojo -o "${PREFIX}/lib/mojo/extramojo.mojoc"
requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}

tests:
  - script:
      - if: unix
        then:
          - |
            set -eu
            target_features=""
            if [ "$(uname -m)" = "x86_64" ]; then
              target_features="--target-features=-avx512f,-avx512bw,-avx512cd,-avx512dq,-avx512vl,-avx512ifma,-avx512vbmi,-avx512vbmi2,-avx512vnni,-avx512bitalg,-avx512vpopcntdq,-avx512fp16,-avx512bf16"
            fi
            for test in $(find ./tests -name 'test_*.mojo' | sort); do
              mojo run ${target_features} -I "${PREFIX}/lib/mojo" -D ASSERT=all "${test}"
            done
    requirements:
      run:
        - mojo ${{ mojo_version }}
    files:
      source:
        - tests/

about:
  homepage: https://github.com/ExtraMojo/ExtraMojo
  license: "Unlicense OR MIT"
  license_file:
    - LICENSE-MIT
    - UNLICENSE
  summary: Extra functionality not yet in the standard library, mostly focused on strings and file IO.
  repository: https://github.com/ExtraMojo/ExtraMojo

extra:
  maintainers:
    - sstadick
  project_name: extramojo
